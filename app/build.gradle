apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "io.github.muntashirakon.bcl"
    compileSdk 36
    defaultConfig {
        applicationId "io.github.muntashirakon.bcl"
        minSdk 21
        targetSdk 35
        versionCode 36
        versionName "1.1.9"
    }
    lint {
        abortOnError false
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            resValue "string", "app_name", "BCL Debug"
            resValue "string", "app_short_name", "BCL Debug"
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Battery Charge Limiter"
            resValue "string", "app_short_name", "BCL"
        }
        fdroid {
            applicationIdSuffix '.fdroid'
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Battery Charge Limiter"
            resValue "string", "app_short_name", "BCL"
        }
    }
    signingConfigs {
        debug {
            storeFile file('dev_keystore.jks')
            storePassword 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyPassword 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyAlias 'key0'
        }
        release {
            // Reuses the repository's dev keystore so the produced APK is installable.
            // Override via -PstoreFile=... etc. or a real signing config for production use.
            def overrideStore = project.findProperty('storeFile')
            storeFile overrideStore ? file(overrideStore) : file('dev_keystore.jks')
            storePassword project.findProperty('storePassword') ?: 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyPassword project.findProperty('keyPassword') ?: 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyAlias project.findProperty('keyAlias') ?: 'key0'
        }
    }
    buildTypes.release.signingConfig signingConfigs.release
    productFlavors {
    }
    buildFeatures {
        buildConfig true
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.topjohnwu.libsu:core:5.2.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
